// Forge 1.12.2 (o FML antigo). Compila contra stubs com os nomes do jogo em tempo de execução (src/stubs, fora do jar).
sourceSets {
    stubs
}

dependencies {
    compileOnly sourceSets.stubs.output
    compileOnly 'org.apache.logging.log4j:log4j-api:2.8.1'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching(['mcmod.info', '**/versao.txt']) { expand(version: project.version) }
}

shadowJar {
    archiveFileName = "NeverMiss-Forge-1.12.2-${project.version}.jar"
}
