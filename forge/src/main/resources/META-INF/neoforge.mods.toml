# NeoForge 1.20.5 em diante (o Forge e o NeoForge 1.20.4 leem o mods.toml, igual a este).
# Sem dependências: o "forge" não existe no NeoForge, e o mod não precisa de nenhum outro.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "nevermiss"
version = "${version}"
displayName = "NeverMiss"
description = "Entrega no servidor o que foi vendido pela NeverMiss."
displayURL = "https://nevermissapps.com"
# Só no servidor: o jogador entra sem o mod (Forge 1.19+ e NeoForge leem isto)
displayTest = "IGNORE_SERVER_VERSION"
