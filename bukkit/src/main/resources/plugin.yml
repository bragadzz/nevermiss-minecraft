name: NeverMiss
version: '${version}'
main: com.nevermissapps.minecraft.NeverMiss
api-version: '1.13'
folia-supported: true
# Só para o Floodgate ligar antes: sem ele o plugin funciona igual, só não entrega para Bedrock.
softdepend: [floodgate]
description: Entrega no servidor o que foi vendido pela NeverMiss.
website: https://nevermissapps.com
commands:
  nevermiss:
    description: Status e configuração da NeverMiss.
    usage: /nevermiss status | testar | recarregar
    permission: nevermiss.admin
  kit:
    description: Pega de novo um kit da NeverMiss que você comprou.
    usage: /kit [nome do kit]
    permission: nevermiss.kit
  nmkit:
    description: O /kit da NeverMiss, para o servidor que já tem outro /kit (EssentialsX).
    usage: /nmkit [nome do kit]
    permission: nevermiss.kit
permissions:
  nevermiss.admin:
    description: Usar /nevermiss.
    default: op
  nevermiss.kit:
    description: Usar /kit e /nmkit.
    default: true
