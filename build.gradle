plugins {
    id 'com.gradleup.shadow' version '8.3.5' apply false
}

subprojects {
    apply plugin: 'java'

    group = 'com.nevermissapps'
    version = '1.3.2'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
    }

    // Jar reproduzível: o mesmo código e o mesmo JDK dão o mesmo SHA-256 (quem compila confere com o publicado)
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

// Um jar por plataforma, com o core e o Gson dentro. O Gson vai relocado: o 1.7.10 não traz o com.google.gson,
// e assim todas as plataformas rodam a mesma versão.
configure(subprojects.findAll { it.name != 'core' }) {
    apply plugin: 'com.gradleup.shadow'

    dependencies {
        implementation project(':core')
    }

    processResources {
        filesMatching(['plugin.yml', 'bungee.yml', 'velocity-plugin.json']) { expand(version: project.version) }
    }

    jar.enabled = false

    shadowJar {
        archiveFileName = "NeverMiss-${project.name.capitalize()}-${project.version}.jar"
        relocate 'com.google.gson', 'com.nevermissapps.minecraft.gson'
        exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/maven/**'
    }

    assemble.dependsOn shadowJar
}
